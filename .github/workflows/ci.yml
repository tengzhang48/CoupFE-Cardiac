name: fast cardiac gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y gfortran ninja-build
      - run: python -m pip install --upgrade pip
      # pyproject.toml pins CoupFE to a full public Git commit; no PyPI fallback.
      - run: python -m pip install -e ".[dev]"
      - run: python .github/scripts/check_runtime_core.py
      - run: python -m pytest -q

  release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build --sdist --wheel
      - run: python -m twine check --strict dist/*
      # The dependency and guard both require the current public Core root.
      # Do not add an audit override in release CI.
      - run: python .github/scripts/check_release_artifacts.py dist --source-root .
